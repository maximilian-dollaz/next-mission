<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice engine test</title>
    <style>
      /* Functional only. Chat 06 owns the real surface — do not build on this. */
      body { font: 14px/1.5 ui-monospace, Menlo, monospace; margin: 0; padding: 20px; max-width: 820px; }
      button { font: inherit; padding: 8px 16px; margin-right: 8px; }
      .row { display: flex; gap: 24px; flex-wrap: wrap; margin: 12px 0; }
      .box { border: 1px solid #ccc; padding: 10px; margin: 12px 0; }
      #log { height: 280px; overflow-y: auto; white-space: pre-wrap; }
      .user { color: #0a5; }
      .agent { color: #05a; }
      .meta { color: #888; }
      .err { color: #c00; }
      #meter { width: 220px; height: 10px; background: #eee; display: inline-block; vertical-align: middle; }
      #meterFill { height: 100%; width: 0; background: #0a5; }
      dt { font-weight: bold; float: left; width: 190px; clear: left; }
      dd { margin: 0 0 2px 196px; }
    </style>
  </head>
  <body>
    <h1>Voice engine test</h1>

    <div>
      <button id="start">Start talking</button>
      <button id="stop" disabled>Stop</button>
      <span id="state" class="meta">idle</span>
    </div>

    <div class="row">
      <span>mic <span id="meter"><span id="meterFill"></span></span></span>
      <span id="gate" class="meta">quiet</span>
    </div>

    <div class="row">
      <span>pacing:</span>
      <button class="pace" data-preset="PATIENT">patient</button>
      <button class="pace" data-preset="SWIFT">swift</button>
      <button class="pace" data-preset="MEDITATIVE">meditative</button>
      <span id="paceNote" class="meta"></span>
    </div>

    <div class="box">
      <strong>Session</strong>
      <dl id="info"><dd class="meta">not connected</dd></dl>
    </div>

    <div class="box">
      <strong>Latency</strong> <span class="meta">— you stop speaking → first sound back</span>
      <dl id="latency"><dd class="meta">no turns yet</dd></dl>
    </div>

    <div class="box">
      <strong>Transcript</strong>
      <div id="log"></div>
    </div>

    <script type="module">
      const OUTPUT_RATE = 24000;
      /** Frames above the energy threshold needed to call it speech. */
      const SPEECH_FRAMES_TO_OPEN = 3;
      /** Quiet after speech before we report the person stopped (latency anchor). */
      const GATE_CLOSE_MS = 350;
      /** Keep playback this far ahead of the clock so chunks do not underrun. */
      const PLAYBACK_LEAD_S = 0.08;

      const $ = (id) => document.getElementById(id);
      const log = $('log');

      let ws, micCtx, playCtx, micStream, workletNode;
      let pacing = null;
      let energyThreshold = 0.012;
      let turnDetection = 'server';

      // Energy gate
      let speaking = false;
      let loudRun = 0;
      let lastLoudAt = 0;
      let closeTimer = null;

      // Playback scheduling
      let nextStartAt = 0;
      let liveSources = [];

      // Latency
      let awaitingFirstAudio = false;
      let speechEndedAt = 0;
      const latencies = [];

      function line(cls, text) {
        const div = document.createElement('div');
        div.className = cls;
        div.textContent = text;
        log.appendChild(div);
        log.scrollTop = log.scrollHeight;
      }

      function setState(s) {
        $('state').textContent = s;
      }

      function renderInfo(ready, actualMicRate) {
        pacing = ready.pacing;
        energyThreshold = pacing.speechEnergyThreshold;
        turnDetection = pacing.turnDetection;
        const warn =
          ready.instructionSource === 'placeholder'
            ? ' ⚠ placeholder — chat 02 protocol not loaded'
            : '';
        $('info').innerHTML = '';
        const rows = [
          ['model', ready.model],
          ['voice instruction', ready.instructionSource + warn],
          ['turn detection', turnDetection],
          ['silence before agent speaks', pacing.silenceBeforeAgentSpeaksMs + ' ms'],
          ['max agent turn', pacing.maxAgentTurnSeconds + ' s'],
          ['latency target', pacing.latencyTargetMs + ' ms'],
          ['affective dialog', String(pacing.affectiveDialog) + ' (hears hesitation)'],
          ['proactive audio', 'unavailable — API rejects the field'],
          ['mic sample rate', actualMicRate + ' Hz' + (actualMicRate === 16000 ? '' : ' (resampled to 16000)')],
          ['session', ready.sessionId],
        ];
        for (const [k, v] of rows) {
          const dt = document.createElement('dt');
          dt.textContent = k;
          const dd = document.createElement('dd');
          dd.textContent = v;
          $('info').append(dt, dd);
        }
        if (ready.instructionNote) line('err', ready.instructionNote);
      }

      function recordLatency(ms) {
        latencies.push(ms);
        const sorted = [...latencies].sort((a, b) => a - b);
        const median = sorted[Math.floor(sorted.length / 2)];
        const target = pacing ? pacing.latencyTargetMs : 1500;
        const hold = pacing ? pacing.silenceBeforeAgentSpeaksMs : 0;
        $('latency').innerHTML = '';
        const rows = [
          ['last', ms + ' ms' + (ms > target ? ' (over target)' : '')],
          ['median of ' + latencies.length, median + ' ms'],
          ['min / max', sorted[0] + ' / ' + sorted[sorted.length - 1] + ' ms'],
          ['minus silence hold', Math.max(0, median - hold) + ' ms — model + network only'],
        ];
        for (const [k, v] of rows) {
          const dt = document.createElement('dt');
          dt.textContent = k;
          const dd = document.createElement('dd');
          dd.textContent = v;
          $('latency').append(dt, dd);
        }
      }

      // ── playback ──────────────────────────────────────────────────────────

      function playChunk(int16) {
        const buf = playCtx.createBuffer(1, int16.length, OUTPUT_RATE);
        const channel = buf.getChannelData(0);
        for (let i = 0; i < int16.length; i++) channel[i] = int16[i] / 0x8000;

        const src = playCtx.createBufferSource();
        src.buffer = buf;
        src.connect(playCtx.destination);

        const startAt = Math.max(playCtx.currentTime + PLAYBACK_LEAD_S, nextStartAt);
        src.start(startAt);
        nextStartAt = startAt + buf.duration;

        liveSources.push(src);
        src.onended = () => {
          liveSources = liveSources.filter((s) => s !== src);
        };
      }

      /** Barge-in: kill everything queued immediately. */
      function flushPlayback() {
        for (const src of liveSources) {
          try { src.stop(); } catch {}
        }
        liveSources = [];
        nextStartAt = 0;
      }

      // ── energy gate ───────────────────────────────────────────────────────

      function onFrame(pcmBuffer, rms) {
        $('meterFill').style.width = Math.min(100, rms * 600) + '%';

        if (ws && ws.readyState === WebSocket.OPEN) ws.send(pcmBuffer);

        const loud = rms > energyThreshold;
        const now = performance.now();

        if (loud) {
          lastLoudAt = now;
          loudRun++;
          if (!speaking && loudRun >= SPEECH_FRAMES_TO_OPEN) {
            speaking = true;
            $('gate').textContent = 'speaking';
            if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
            send({ t: 'speech', active: true });
          }
          return;
        }

        loudRun = 0;
        if (!speaking || closeTimer) return;

        // In client mode we own the whole silence window, so hold for the
        // configured threshold before handing the floor over. In server mode we
        // only need a short debounce — the API's VAD owns the real threshold —
        // and we report it just to anchor the latency measurement.
        const hold = turnDetection === 'client' && pacing
          ? pacing.silenceBeforeAgentSpeaksMs
          : GATE_CLOSE_MS;

        closeTimer = setTimeout(() => {
          closeTimer = null;
          speaking = false;
          $('gate').textContent = 'quiet';
          // Backdate to the last loud frame, so the figure measures from when
          // the person actually stopped rather than when our timer fired.
          const msSinceLastSpeech = Math.round(performance.now() - lastLoudAt);
          speechEndedAt = lastLoudAt;
          awaitingFirstAudio = true;
          send({ t: 'speech', active: false, msSinceLastSpeech });
        }, hold);
      }

      function send(obj) {
        if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj));
      }

      // ── wiring ────────────────────────────────────────────────────────────

      async function start() {
        $('start').disabled = true;
        flushPlayback();
        latencies.length = 0;

        try {
          micStream = await navigator.mediaDevices.getUserMedia({
            audio: {
              channelCount: 1,
              echoCancellation: true,
              noiseSuppression: true,
              autoGainControl: true,
            },
          });
        } catch (error) {
          line('err', 'microphone denied: ' + error.message);
          $('start').disabled = false;
          return;
        }

        micCtx = new AudioContext({ sampleRate: 16000 });
        playCtx = new AudioContext({ sampleRate: OUTPUT_RATE });
        await micCtx.audioWorklet.addModule('capture-worklet.js');

        const source = micCtx.createMediaStreamSource(micStream);
        workletNode = new AudioWorkletNode(micCtx, 'capture-processor');
        workletNode.port.onmessage = (event) => {
          const d = event.data;
          if (d.type === 'frame') onFrame(d.pcm, d.rms);
        };
        source.connect(workletNode);
        // Keep the graph pulling without routing the mic to the speakers.
        const mute = micCtx.createGain();
        mute.gain.value = 0;
        workletNode.connect(mute).connect(micCtx.destination);

        const proto = location.protocol === 'https:' ? 'wss' : 'ws';
        ws = new WebSocket(`${proto}://${location.host}/voice`);
        ws.binaryType = 'arraybuffer';

        ws.onopen = () => {
          setState('connecting');
          $('stop').disabled = false;
        };

        ws.onmessage = (event) => {
          if (event.data instanceof ArrayBuffer) {
            if (awaitingFirstAudio) {
              awaitingFirstAudio = false;
              recordLatency(Math.round(performance.now() - speechEndedAt));
            }
            // Int16Array throws on an odd byte length, which would kill all
            // further playback. Should never happen with 16-bit PCM; drop the
            // stray byte rather than lose the conversation if it does.
            const even = event.data.byteLength & ~1;
            if (even > 0) playChunk(new Int16Array(event.data, 0, even / 2));
            return;
          }

          const msg = JSON.parse(event.data);
          if (msg.t === 'ready') {
            renderInfo(msg, micCtx.sampleRate);
            line('meta', `— session ${msg.sessionId} on ${msg.model}`);
          } else if (msg.t === 'state') {
            setState(msg.state);
          } else if (msg.t === 'turn') {
            const lat = msg.turn.responseLatencyMs ? ` (${msg.turn.responseLatencyMs}ms)` : '';
            const cut = msg.turn.interrupted ? ' [interrupted]' : '';
            line(msg.turn.speaker, `${msg.turn.speaker}${lat}${cut}: ${msg.turn.text}`);
          } else if (msg.t === 'interrupted') {
            flushPlayback();
            line('meta', '— interrupted, playback dropped');
          } else if (msg.t === 'waiting') {
            line('meta', '— model is waiting for you to continue (holding silence)');
          } else if (msg.t === 'pacing') {
            pacing = msg.pacing;
            energyThreshold = pacing.speechEnergyThreshold;
            $('paceNote').textContent = msg.vadFrozen
              ? 'max turn + target changed; silence window frozen at connect (server VAD)'
              : `silence window now ${pacing.silenceBeforeAgentSpeaksMs}ms`;
            line('meta', `— pacing → ${pacing.silenceBeforeAgentSpeaksMs}ms silence, ${pacing.maxAgentTurnSeconds}s max turn`);
          } else if (msg.t === 'error') {
            line('err', 'error: ' + msg.message);
          }
        };

        ws.onclose = () => {
          setState('closed');
          $('start').disabled = false;
          $('stop').disabled = true;
        };
        ws.onerror = () => line('err', 'websocket error');
      }

      function stop() {
        send({ t: 'stop' });
        flushPlayback();
        if (closeTimer) { clearTimeout(closeTimer); closeTimer = null; }
        speaking = false;
        workletNode?.port.close();
        micStream?.getTracks().forEach((t) => t.stop());
        micCtx?.close();
        playCtx?.close();
        ws?.close();
        $('stop').disabled = true;
        $('start').disabled = false;
        setState('idle');
        $('gate').textContent = 'quiet';
      }

      $('start').onclick = start;
      $('stop').onclick = stop;
      for (const btn of document.querySelectorAll('.pace')) {
        btn.onclick = () => send({ t: 'pacing', preset: btn.dataset.preset });
      }
    </script>
  </body>
</html>
